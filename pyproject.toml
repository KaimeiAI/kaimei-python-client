[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kaimei"
dynamic = ["version"]
description = "Official Python client for the Kaimei (解明) explainability API."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Kaimei AI" }]
keywords = ["kaimei", "xai", "explainability", "interpretability", "machine-learning", "shap"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.25",
]

[project.optional-dependencies]
models = ["numpy>=1.24"]
dev = [
  "pytest>=7",
  "respx>=0.21",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "ruff>=0.6",
  "mypy>=1.8",
]

[project.urls]
Homepage = "https://kaimei.ai"
Documentation = "https://github.com/KaimeiAI/kaimei-python-client#readme"
Repository = "https://github.com/KaimeiAI/kaimei-python-client"
Issues = "https://github.com/KaimeiAI/kaimei-python-client/issues"
API = "https://github.com/KaimeiAI/kaimei"
Changelog = "https://github.com/KaimeiAI/kaimei-python-client/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/kaimei/client.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kaimei"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: hits a live Kaimei API (needs KAIMEI_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/kaimei/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
pretty = true
packages = ["kaimei"]
mypy_path = "src"
