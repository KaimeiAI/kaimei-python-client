name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # One version failing should not cancel the others before their tests run.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # Python 3.9 is past end of life and has no build for Ubuntu 26.04, which ubuntu-latest now is.
          # 24.04 still has one, and the package still supports 3.9.
          - python-version: "3.9"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: mypy
        run: mypy
      - name: Tests
        run: pytest
