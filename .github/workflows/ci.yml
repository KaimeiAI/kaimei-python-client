name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # One version failing should not cancel the others before their tests run.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # Python 3.9 is past end of life and has no build for Ubuntu 26.04, which ubuntu-latest now is.
          # 24.04 still has one, and the package still supports 3.9.
          - python-version: "3.9"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: mypy
        run: mypy
      - name: Tests
        run: pytest

  onnx:
    # The ONNX route, the agent's ONNX Runtime path and the tokenizer comparisons need onnx, onnxruntime, PyTorch,
    # skl2onnx and Hugging Face tokenizers, which the job above does not install, so it skips those tests. The
    # Hugging Face reading (task, labels, detectors, encoder-decoders), diffusion samplers and .gguf files need
    # transformers, diffusers, gguf and accelerate; the models are built from small configs, nothing is downloaded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with the ONNX route
        run: |
          python -m pip install -U pip
          python -m pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,onnx]" onnx==1.23.2 onnxruntime==1.32.0 skl2onnx==1.20.0 onnxmltools==1.16.0 tokenizers==0.23.3 xgboost lightgbm pandas
          python -m pip install transformers==5.24.0 diffusers==0.43.0 gguf==0.19.0 accelerate==1.16.0
      - name: Tests
        run: pytest

  frameworks:
    # TensorFlow SavedModels and .tflite files, Keras 3 models and JAX functions go to ONNX through tf2onnx and
    # jax2onnx. Their tests need TensorFlow and JAX, which do not share an environment with PyTorch well, so they
    # have a job of their own; the PyTorch tests skip here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with TensorFlow and JAX
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,onnx]" onnx==1.23.2 onnxruntime==1.32.0 tensorflow==2.21.0 keras==3.15.1 tf2onnx==1.17.0 jax==0.12.1 jax2onnx==0.19.1 flax==0.12.12
      - name: Tests
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: pytest
